# Nginx reverse proxy — ganti DOMAIN-LU.COM dengan domain produksi.
# SSE-safe: buffering mati + timeout panjang untuk /api/wa/messages/stream.
# HTTP → redirect HTTPS (setelah certbot). Pasang file ini, lalu certbot --nginx.
upstream wapp {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name DOMAIN-LU.COM;
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name DOMAIN-LU.COM;

  # ssl_certificate ...;  # diisi otomatis oleh certbot
  # ssl_certificate_key ...;

  client_max_body_size 2m;

  location /api/wa/messages/stream {
    proxy_pass http://wapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  location / {
    proxy_pass http://wapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
